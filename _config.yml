# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Divya Ail
email: divyail3@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Divya Ail. I am a researcher in the field of retinal neuroscience, with a focus on unraveling the molecular mechanisms involved in the normal functioning of the retina and the perturbations of these mechanisms in diseased state. 
twitter_username: Divya Ail
github_username: Divya-Ail
minimal_mistakes_skin: contrast
search: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
  - jekyll-seo-tag

author:
  name   : "Divya Ail"
  avatar : "/assets/images/myphoto.png"
  bio    : "Researcher in Retinal Neuroscience"
  location: "Paris, France"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://divya-ail.github.io"
    - label: "LinkedIn"
      icon: "fa-brands fa-square-linkedin"
      url: "https://www.linkedin.com/in/divya-ail-4b1854b/"
    - label: "Orcid"
      icon: "fa-brands fa-orcid"
      url: "https://orcid.org/0000-0002-9122-5998"
    - label: "ResearchGate"
      icon: "fa-brands fa-researchgate"
      url: "https://www.researchgate.net/profile/Divya-Ail"
    - label: "Google Scholar"
      icon: "fa-brands fa-google-scholar"
      url: "https://scholar.google.fr/citations?user=pxDf_MUAAAAJ&hl=en"
    - label: "Web of Science"
      icon: "fa-solid fa-microscope"
      url: "https://www.webofscience.com/wos/author/record/AAB-7567-2022"
    # label: "GitHub"
    # icon: "fab fa-fw fa-github"
    # url: "https://github.com/"
    

footer:
  links:
   # - label: "Twitter"
   #   icon: "fab fa-fw fa-twitter-square"
   #   url: "https://twitter.com/"
   # - label: "GitHub"
   #   icon: "fab fa-fw fa-github"
   #   url: "https://github.com/"
   # - label: "Instagram"
   #   icon: "fab fa-fw fa-instagram"
   #   url: "https://instagram.com/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
